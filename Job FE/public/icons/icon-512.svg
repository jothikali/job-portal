<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#0F172A"/>
  <!-- Blue glow -->
  <circle cx="400" cy="110" r="140" fill="#2563EB" opacity="0.15"/>
  <circle cx="100" cy="400" r="100" fill="#2563EB" opacity="0.08"/>
  <!-- Briefcase icon -->
  <g transform="translate(90, 100)">
    <!-- Handle -->
    <path d="M112 44 C112 26 220 26 220 44" stroke="#3B82F6" stroke-width="18" fill="none" stroke-linecap="round"/>
    <!-- Case body -->
    <rect x="36" y="60" width="260" height="210" rx="30" fill="#2563EB"/>
    <!-- Center divider line -->
    <rect x="36" y="152" width="260" height="20" fill="#1D4ED8"/>
    <!-- Latch -->
    <rect x="112" y="142" width="48" height="40" rx="10" fill="#93C5FD"/>
  </g>
  <!-- App name -->
  <text x="256" y="430" font-family="Arial Black, sans-serif" font-weight="900" font-size="52" fill="#3B82F6" text-anchor="middle" letter-spacing="2">JobPortal</text>
  <text x="256" y="480" font-family="Arial, sans-serif" font-weight="600" font-size="26" fill="#475569" text-anchor="middle" letter-spacing="6">ATS</text>
</svg>
