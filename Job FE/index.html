<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary meta -->
    <title>Job Nest — Find, Connect &amp; Grow</title>
    <meta name="description" content="Find jobs, track applications, and manage your hiring pipeline — all in one place." />
    <meta name="theme-color" content="#0F172A" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon — your custom logo -->
    <link rel="icon" type="image/jpeg" href="/icons/job-logo.jpeg" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Job Nest" />
    <link rel="apple-touch-icon" href="/icons/job-logo.jpeg" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/job-logo.jpeg" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/job-logo.jpeg" />

    <!-- Microsoft / Windows tiles -->
    <meta name="msapplication-TileColor" content="#0F172A" />
    <meta name="msapplication-TileImage" content="/icons/job-logo.jpeg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Job Nest — Find, Connect &amp; Grow" />
    <meta property="og:description" content="Find jobs, track applications, and manage your hiring pipeline." />
    <meta property="og:image" content="/icons/job-logo.jpeg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then((reg) => console.log('[PWA] Service worker registered:', reg.scope))
            .catch((err) => console.warn('[PWA] Service worker failed:', err));
        });
      }
    </script>
  </body>
</html>
